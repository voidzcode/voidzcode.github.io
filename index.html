<!DOCTYPE html>
<html>
<head>
    <title>voidzcode</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", monospace;
            background: radial-gradient(circle at top, #04170c 0%, #000 45%, #010101 100%);
            color: #eafff1;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(120deg, rgba(0,255,102,0.08), transparent 45%, rgba(0,255,102,0.04));
            pointer-events: none;
            z-index: -2;
            animation: drift 16s ease-in-out infinite alternate;
        }

        #matrix {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.9;
        }

        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            text-shadow: 0 0 15px rgba(0,255,102,0.35);
            opacity: 1;
            transform: none;
            transition: none;
        }

        .content.ready {
            opacity: 1;
            transform: none;
        }

        h1 {
            font-size: clamp(2.8rem, 7vw, 4.6rem);
            color: #00ff66;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            animation: glow 2.4s ease-in-out infinite alternate;
        }

        .subtitle {
            margin-top: 0.8rem;
            font-size: clamp(1rem, 2.3vw, 1.2rem);
            color: rgba(234, 255, 241, 0.9);
            letter-spacing: 0.08em;
            opacity: 0.95;
        }

        #terminal-output {
            margin: 20px auto 0;
            max-width: 780px;
            min-height: 11.5em;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-size: clamp(1.05rem, 2.3vw, 1.45rem);
            line-height: 1.6;
            overflow: hidden;
        }

        .terminal-line {
            min-height: 1.6em;
            width: 100%;
            white-space: pre-wrap;
            opacity: 1;
            transform: translateY(8px);
            transition: transform 0.7s ease, opacity 0.7s ease;
        }

        .terminal-line.completed-line {
            opacity: 0.95;
            transform: translateY(0);
        }

        .terminal-line.scroll-up {
            transform: translateY(-1.4em);
            opacity: 0;
        }

        .cursor {
            display: inline-block;
            width: 0.6em;
            margin-left: 2px;
            border-right: 2px solid #00ff66;
            animation: blink 0.8s steps(1) infinite;
        }

        .hero-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1.2rem;
            min-height: 5.2rem;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
        }

        .nav-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #00ff66;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 102, 0.65);
            border-radius: 999px;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(0,255,102,0.45);
            box-shadow: 0 0 18px rgba(0,255,102,0.15);
            opacity: 1;
            pointer-events: auto;
            transform: none;
            transition: all 200ms ease;
            backdrop-filter: blur(8px);
            animation: pulseGlow 2.2s ease-in-out infinite alternate;
        }

        .hero-actions .nav-button,
        .hero-actions .skip-button {
            transform: none;
        }

        .nav-button:hover {
            background: #00ff66;
            color: black;
            box-shadow: 0 0 26px rgba(0,255,102,0.45);
            transform: translateY(-2px) scale(1.02);
        }


        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        @keyframes glow {
            from { text-shadow: 0 0 8px rgba(0,255,102,0.55); }
            to { text-shadow: 0 0 20px rgba(0,255,102,0.95); }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 8px rgba(0,255,102,0.2); }
            to { box-shadow: 0 0 24px rgba(0,255,102,0.45); }
        }

        @keyframes drift {
            from { transform: translate3d(-2%, -1%, 0); }
            to { transform: translate3d(2%, 1%, 0); }
        }

        @media (max-width: 640px) {
            .content {
                padding: 1.4rem 1rem;
            }

            #terminal-output {
                min-height: 13em;
            }
        }
    </style>
</head>


<body>

<canvas id="matrix"></canvas>


<div class="content" id="hero">
    <h1>voidzcode</h1>
    <div class="subtitle">my online portfolio!</div>
    <div class="hero-actions">
        <div id="nav-buttons" class="nav-buttons">
            <a id="games-button" class="nav-button" href="https://voidzcode.github.io/games/index.html" target="_self">games</a>
            <a id="tools-button" class="nav-button" href="https://voidzcode.github.io/tools/index.html" target="_self">tools</a>
            <a id="about-button" class="nav-button" href="https://voidzcode.github.io/about%20me/index.html" target="_self">about me</a>
            <a id="updates-button" class="nav-button" href="https://voidzcode.github.io/updates/index.html" target="_self">updates</a>
             <a id="repositories-button" class="nav-button" href="https://voidzcode.github.io/repos/index.html" target="_self">repositories</a>
        </div>
    </div>
</div>



<script>

window.onload = () => {
    document.getElementById("hero").classList.add("ready");
};





const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let viewWidth = window.innerWidth;
let viewHeight = window.innerHeight;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    viewWidth = window.innerWidth;
    viewHeight = window.innerHeight;

    canvas.width = Math.floor(viewWidth * dpr);
    canvas.height = Math.floor(viewHeight * dpr);
    canvas.style.width = viewWidth + "px";
    canvas.style.height = viewHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();

const characters = "VOIDZCODE01<>[]{}$#@ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";
const fontSize = 18;
let columns;
let drops = [];

function setupMatrix() {
    columns = Math.max(1, Math.floor(viewWidth / fontSize));
    drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * (viewHeight / fontSize);
    }
}

setupMatrix();

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, viewWidth, viewHeight);

    ctx.font = fontSize + "px monospace";
    ctx.fillStyle = "#00ff66";
    ctx.textBaseline = "top";

    for (let i = 0; i < drops.length; i++) {
        const char = characters[Math.floor(Math.random() * characters.length)];
        ctx.fillText(char, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > viewHeight && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i]++;
    }

    requestAnimationFrame(drawMatrix);
}

drawMatrix();

window.addEventListener("resize", () => {
    resize();
    setupMatrix();
});


</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to-do</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #000;
            --panel: rgba(10, 16, 12, 0.82);
            --panel-alt: rgba(255, 255, 255, 0.03);
            --accent: #00ff66;
            --accent-soft: rgba(0, 255, 102, 0.12);
            --text: #eafef0;
            --muted: rgba(234, 254, 240, 0.74);
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ff6b6b;
            --shadow: rgba(0, 255, 102, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 2rem 1rem;
            font-family: "Segoe UI", Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top left, rgba(0,255,102,0.18), transparent 30%),
                linear-gradient(135deg, rgba(0,255,102,0.08), transparent 60%);
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.95));
            pointer-events: none;
            z-index: -1;
        }

        .page {
            width: min(820px, 94vw);
            margin: 0 auto;
            padding: clamp(1.2rem, 3vw, 2rem);
            background: var(--panel);
            border: 1px solid rgba(0,255,102,0.22);
            border-radius: 24px;
            box-shadow: 0 0 26px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            padding: 0.7rem 1rem;
            border-radius: 999px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid rgba(0,255,102,0.18);
            background: rgba(255,255,255,0.03);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        h1 {
            color: var(--accent);
            font-size: clamp(2rem, 5vw, 2.8rem);
            letter-spacing: 0.14em;
            text-transform: lowercase;
            text-shadow: 0 0 18px rgba(0,255,102,0.2);
        }

        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1rem;
        }

        .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.9rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .meta strong {
            color: var(--text);
        }

        .todo-list {
            list-style: none;
            display: grid;
            gap: 0.7rem;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            padding: 0.9rem 0.95rem;
            border-radius: 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            transition: border-color 150ms ease, transform 150ms ease;
        }

        .todo-item:hover {
            border-color: rgba(0,255,102,0.22);
            transform: translateY(-1px);
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
            flex: 1;
        }

        .todo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px rgba(0,255,102,0.55);
            flex-shrink: 0;
        }

        .todo-text {
            flex: 1;
            color: var(--text);
            word-break: break-word;
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: var(--muted);
        }

        .empty-state {
            padding: 1rem;
            text-align: center;
            border: 1px dashed rgba(0,255,102,0.22);
            border-radius: 12px;
            color: var(--muted);
            background: rgba(0,255,102,0.04);
        }

        @media (max-width: 640px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .input-row {
                grid-template-columns: 1fr;
            }

            .todo-item {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="back-btn" href="https://voidzcode.github.io">← home</a>
            <h1>to-do</h1>
        </div>

        <div class="card">
            <div class="meta">
                <span>tasks: <strong id="task-count">0</strong></span>
                <span id="remaining-text">0 remaining</span>
            </div>

            <ul id="todo-list" class="todo-list"></ul>
        </div>
    </div>

    <script>
        const todoList = document.getElementById('todo-list');
        const taskCount = document.getElementById('task-count');
        const remainingText = document.getElementById('remaining-text');

        const todos = [
            { text: 'get rid of index.html at the end of website URLs', done: true },
            { text: 'polish the website', done: false },
            { text: 'fix multiplayer snake', done: false },
            { text: 'release the first build for the LocalDrop project', done: true }
        ];

        function updateStats() {
            const total = todos.length;
            const remaining = todos.filter(task => !task.done).length;

            taskCount.textContent = total;
            remainingText.textContent = `${remaining} remaining`;
        }

        function renderTodos() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'empty-state';
                empty.textContent = 'nothing here yet.';
                todoList.appendChild(empty);
                updateStats();
                return;
            }

            todos.forEach((todo) => {
                const item = document.createElement('li');
                item.className = `todo-item ${todo.done ? 'done' : ''}`;

                item.innerHTML = `
                    <div class="todo-left">
                        <span class="todo-dot"></span>
                        <span class="todo-text">${todo.text}</span>
                    </div>
                `;

                todoList.appendChild(item);
            });

            updateStats();
        }

        renderTodos();
    </script>
<script src="../js/site-audio.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>games</title>
    <style>
        :root {
            --bg: #0f1417;
            --panel: rgba(20, 25, 28, 0.9);
            --text: #f4efe8;
            --muted: #b9b1a8;
            --accent: #d7a46a;
            --line: rgba(255,255,255,0.08);
            --shadow: rgba(0,0,0,0.28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            font-family: "Segoe UI", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(215, 164, 106, 0.12), transparent 28%),
                linear-gradient(180deg, #0c1114 0%, #101619 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            mask-image: radial-gradient(circle at center, black 32%, transparent 100%);
            pointer-events: none;
        }

        .panel {
            width: min(92vw, 700px);
            padding: clamp(2rem, 4vw, 3rem);
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--panel);
            box-shadow: 0 24px 60px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .eyebrow {
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: clamp(2.6rem, 6vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.06em;
            margin-bottom: 0.8rem;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 1.2rem;
        }

        .button-stack {
            display: grid;
            gap: 0.75rem;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.95rem 1.4rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.08em;
            background: rgba(255,255,255,0.02);
            color: var(--text);
            border: 1px solid var(--line);
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .button:hover {
            transform: translateY(-2px);
            border-color: rgba(215, 164, 106, 0.35);
            background: rgba(215, 164, 106, 0.04);
        }

        .button.secondary {
            margin-top: 0.8rem;
            background: rgba(215, 164, 106, 0.08);
            border-color: rgba(215, 164, 106, 0.18);
            color: #f1d7b2;
        }
    </style>
</head>
<body>
    <main class="panel">
        <div class="eyebrow">playful builds</div>
        <h1>games</h1>
        <p class="subtitle">a small collection of browser games, experiments, and quick distractions.</p>
        <div class="button-stack">
            <a class="button" href="https://voidzcode.github.io/games/snake" target="_blank" rel="noopener noreferrer">voidz snake</a>
            <a class="button" href="https://voidzcode.github.io/games/multiplayer-snake/snake-photon.html" target="_blank" rel="noopener noreferrer">multiplayer snake</a>
            <a class="button" href="https://voidzcode.github.io/games/aim-trainer-game/" target="_blank" rel="noopener noreferrer">aim trainer</a>
            <a class="button" href="https://coolmathgames.com" target="_blank" rel="noopener noreferrer">cool math games</a>
            <a class="button" href="https://play-cs.com/" target="_blank" rel="noopener noreferrer">counter-strike</a>
            <button class="button secondary" type="button" onclick="history.back()">Go back</button>
        </div>
    </main>
<script src="../js/site-audio.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aim Trainer Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: skyblue;
        font-family: "Google Sans", sans-serif;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Google Sans", sans-serif;
        font-weight: 900;
      }

      p {
        margin: 0 0 10px;
        font-family: "Google Sans", sans-serif;

  <body>
    <h1 align="center">AIM TRAINER GAME</h1>
    <p align="center">Welcome to the Aim Trainer Game!</p>

    <div align="center">

        <button class="btn btn-success" onclick="location.href='https://voidzcode.github.io/games/';">
        <span>Back to Games</span>
        </button>
        <button class="btn btn-success" onclick="location.href='https://voidzcode.github.io/games/aim-trainer-game/game/';">
        <span>Start Game</span>
        </button>
        <button class="btn btn-success" onclick="location.href='https://voidzcode.github.io/games/aim-trainer-game/leaderboard/';">

</button>

        <p style="color:rgba(234,255,241,0.9);line-height:1.6">HTML (HyperText Markup Language) is the standard markup language used to structure content on the web. It defines elements like headings, paragraphs, links, images, and forms. HTML provides the semantic structure that browsers render and that CSS and JavaScript enhance.</p>
